<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEF3F9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Math"><title>Math Workshop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Same look as Spelling Workshop. Ten frames and number bonds are the main objects, drawn like the Reveal Math book. */
:root{
  --bg:#EEF3F9; --surface:#FFFFFF; --ink:#16264A; --muted:#566789; --line:#CBD6E8;
  --tile:#FFCB47; --tile-edge:#D99A00; --tile-ink:#33260A;
  --sound:#27B0A3; --sound-edge:#15867B; --sound-ink:#032B27; --snd-text:#15867B;
  --action:#3556D8; --action-ink:#FFFFFF;
  --good:#1F8F52; --good-bg:#DDF3E6; --bad:#C8402F; --bad-bg:#FBE3DF; --info-bg:#FFF1CC;
  color-scheme:light;--display:'Fredoka',system-ui,sans-serif; --text:'Andika','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1730; --surface:#17234A; --ink:#EAF0FF; --muted:#A3B1D6; --line:#2B3A6B;
  --snd-text:#4FD6C8; --action:#8CA6FF; --action-ink:#0B1330;
  --good:#5FD08E; --good-bg:#123B2A; --bad:#FF8B7B; --bad-bg:#3F1D1D; --info-bg:#3A3112}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--action);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:2.1rem;line-height:1.15}
h2{font-size:1.2rem}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:6px 0 0}
section{margin-top:26px}
.sn{color:var(--snd-text)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top>div{min-width:0}
.avatar{width:84px;height:84px;flex:none}
.avatar .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.avatar .eyes{animation:none}}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;border-bottom:2px solid var(--line)}
.tab{font-family:var(--display);font-weight:600;font-size:1.15rem;padding:10px 18px;border:0;background:transparent;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--action)}
.tab.plus{font-size:1.4rem;padding:6px 16px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.act{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.act b{display:block;font-size:1.1rem}
.act span{color:var(--muted);font-size:.92rem}
.act:active{transform:translateY(1px)}
.act.mix{grid-column:1/-1;background:var(--action);border-color:var(--action);color:var(--action-ink)}
.act.mix span{color:inherit;opacity:.9}
.act.off{opacity:.55;border-style:dashed;cursor:default}
.foot{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--muted);font-size:.9rem}
.link{background:none;border:0;padding:4px 0;color:var(--action);text-decoration:underline;font-size:.95rem}
.field{width:100%;font-family:var(--text);font-size:1.05rem;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:10px 12px;appearance:auto}
label{display:block;font-weight:700;margin:16px 0 6px}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 .field{flex:1;min-width:0}
.btn{display:block;width:100%;font-size:1.15rem;font-weight:700;padding:14px 18px;border-radius:14px;border:0;background:var(--action);color:var(--action-ink);border-bottom:5px solid rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn.quiet{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:.95rem;border-bottom-width:4px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1;min-width:140px}
.msg{border-radius:14px;padding:10px 14px;margin:10px 0;font-size:1.05rem}
.msg.good{background:var(--good-bg);color:var(--good)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg.info{background:var(--info-bg)}
.msg b{font-size:1.2rem}
.notice{background:var(--info-bg);border-radius:12px;padding:10px 14px;margin-top:16px;font-size:.92rem}
.bar{display:flex;align-items:center;gap:12px}
.ghost{background:none;border:0;padding:8px 4px;font-size:1rem;font-weight:700;color:var(--muted)}
.track{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .3s}
.cnt{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt{font-family:var(--display);font-size:1.3rem;margin:14px 0 4px;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.tile{min-width:3.6rem;height:3.8rem;padding:0 12px;border-radius:14px;font-family:var(--text);font-size:2rem;font-weight:700;display:inline-grid;place-items:center;line-height:1;background:var(--tile);color:var(--tile-ink);border:0;border-bottom:5px solid var(--tile-edge)}
.tile:active{transform:translateY(2px);border-bottom-width:3px}
.tile[disabled]{opacity:.35;cursor:default;transform:none}
.stars{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.star{width:30px;height:30px;border-radius:50%;background:var(--line)}
.star.on{background:var(--tile)}
.chk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
.chk[aria-pressed=true]{border-color:var(--action);background:color-mix(in srgb,var(--action) 12%,var(--surface))}
.chk .box{flex:none;width:26px;height:26px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--action-ink)}
.chk[aria-pressed=true] .box{background:var(--action);border-color:var(--action)}
.chk small{display:block;color:var(--muted)}
/* equations, bond, ten frames */
.eqs{display:flex;flex-direction:column;align-items:center;gap:2px;margin:14px 0 4px;font-family:var(--display);font-weight:600}
.eq{font-size:2.1rem;line-height:1.2}
.eq.step{font-size:1.7rem;color:var(--snd-text)}
.eq .q{color:var(--muted);border-bottom:4px dashed var(--muted);padding:0 .4em}
.bond{display:block;width:min(100%,160px);height:auto;margin:2px auto 0}
.frames{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0}
.fw{width:min(100%,290px)}
.fcap{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 4px}
.frame{display:grid;grid-template-columns:repeat(5,1fr);border:3px solid var(--ink);border-radius:10px;background:var(--surface);overflow:hidden}
.cell{aspect-ratio:1;border-right:2px solid var(--line);border-bottom:2px solid var(--line);display:grid;place-items:center}
.cell:nth-child(5n){border-right:0}
.cell:nth-child(n+6){border-bottom:0}
.ctr{width:72%;height:72%;border-radius:50%;background:var(--tile);border:3px solid var(--tile-edge);padding:0;display:grid;place-items:center;font-size:1.6rem;font-weight:700;line-height:1;color:var(--bad)}
.ctr.x{background:transparent;border-color:var(--muted)}
button.ctr:active{transform:scale(.92)}
button.ctr.tap{box-shadow:0 0 0 3px var(--action)}
.worked{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:12px 0}
.worked b{font-family:var(--display)}
.worked ol{margin:8px 0 4px;padding-left:1.3rem}
.worked li{margin:2px 0}
</style></head><body>
<div class="wrap" id="app"><noscript>Math Workshop needs JavaScript turned on.</noscript></div>
<script>
(function(){
var KEY='math-workshop-v1', SPELL_KEY='spelling-workshop-v1', SOLID=2, ROUNDS=8, MINUS='\u2212';

/* Lesson catalog: ids match the book's lesson numbers. built:true means the app can practice it now. */
var CATALOG=[
 {id:'4-11',title:'True or false equations',blurb:'Compare amounts on both sides.',built:false},
 {id:'5-1',title:'Take away to find the difference',blurb:'Cross out counters.',built:false},
 {id:'5-2',title:'Count back to subtract',blurb:'Number line, start at the total.',built:false},
 {id:'5-3',title:'Count on to subtract',blurb:'Number line, jumps are the difference.',built:false},
 {id:'5-4',title:'Make a 10 to subtract',blurb:'Ten frames and number bonds.',built:true}
];
var LES={};CATALOG.forEach(function(l,i){l.ord=i;LES[l.id]=l});

/* 5-4 facts: 11 to 18 minus a number that crosses ten (so the ones digit of the total is smaller). */
var FACTS={'5-4':[]};
for(var fa=11;fa<=18;fa++)for(var fb=fa-9;fb<=9;fb++)FACTS['5-4'].push({l:'5-4',a:fa,b:fb});
function fkey(f){return f.l+'|'+f.a+'-'+f.b}
function flabel(f){return f.a+' '+MINUS+' '+f.b}

/* ---------- storage ---------- */
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fmtDate(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');if(!m)return d||'';return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]+' '+(+m[3])}
function mkKid(name,id){return{id:id||uid('k'),name:name,chapters:[],stats:{},view:{mode:'current'}}}
function mkChapter(name,lessons,date){return{id:uid('c'),date:date||today(),name:name,lessons:lessons}}
function fixKid(k){k.id=k.id||uid('k');k.name=k.name||'Kid';k.stats=k.stats||{};k.view=k.view||{mode:'current'};
 k.chapters=(Array.isArray(k.chapters)?k.chapters:[]).map(function(c){return{id:c.id||uid('c'),date:c.date||today(),name:c.name||'Chapter',lessons:(c.lessons||[]).filter(function(l){return LES[l]})}}).filter(function(c){return c.lessons.length});return k}
function load(){
 var raw=null;try{raw=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(raw&&Array.isArray(raw.kids)&&raw.kids.length){raw.kids.forEach(fixKid);return{kids:raw.kids,kid:raw.kid}}
 /* first run: borrow the kid names and ids from the reading app when it lives on the same site */
 var kids=[],sp=null;try{sp=JSON.parse(localStorage.getItem(SPELL_KEY)||'null')}catch(e){}
 if(sp&&Array.isArray(sp.kids))sp.kids.forEach(function(k){if(k&&k.name)kids.push(mkKid(String(k.name).slice(0,20),k.id?String(k.id):undefined))});
 if(!kids.length)kids=[mkKid('Oliver'),mkKid('Freddie')];
 var o=kids.find(function(k){return k.name.toLowerCase()==='oliver'});
 if(o)o.chapters.push(mkChapter('Chapter 5',['5-1','5-2','5-3','5-4']));
 return{kids:kids,kid:(o||kids[0]).id}}
var store=load();
if(!store.kids.some(function(k){return k.id===store.kid}))store.kid=store.kids[0].id;
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:1,kids:store.kids,kid:store.kid}))}catch(e){}}
function curKid(){return store.kids.find(function(k){return k.id===store.kid})||store.kids[0]}
function curChapter(k){var best=null;k.chapters.forEach(function(c){if(!best||c.date>=best.date)best=c});return best}
function sortL(ids){return ids.slice().sort(function(a,b){return LES[a].ord-LES[b].ord})}
/* which lessons the practice buttons use right now */
function scope(){var k=curKid(),v=k.view||{mode:'current'};
 if(!k.chapters.length)return{name:'No chapter yet',lessons:[],mode:'none',chapter:null};
 if(v.mode==='all'){var seen={},ls=[];k.chapters.forEach(function(c){c.lessons.forEach(function(l){if(!seen[l]){seen[l]=1;ls.push(l)}})});return{name:'All chapters combined',lessons:sortL(ls),mode:'all',chapter:null}}
 var cur=curChapter(k),ch=v.mode==='chapter'?k.chapters.find(function(c){return c.id===v.cid}):null;
 if(!ch||ch.id===cur.id)return{name:cur.name,lessons:sortL(cur.lessons),mode:'current',chapter:cur};
 return{name:ch.name,lessons:sortL(ch.lessons),mode:'chapter',chapter:ch}}
function st(f){var s=curKid().stats;var key=fkey(f);return s[key]||(s[key]={ok:0,miss:0,streak:0})}
function solidIn(lid){return FACTS[lid].filter(function(f){return st(f).streak>=SOLID}).length}

/* ---------- drawing helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var AVATAR='<svg class="avatar" viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="113" rx="30" ry="5" fill="rgba(0,0,0,.12)"/><path d="M60 20c-3-10 5-15 12-12-2 4-1 8 3 11" fill="none" stroke="var(--sound-edge)" stroke-width="5" stroke-linecap="round"/><circle cx="60" cy="65" r="44" fill="var(--sound)" stroke="var(--sound-edge)" stroke-width="4"/><g class="eyes"><ellipse cx="43" cy="57" rx="10" ry="12" fill="#fff"/><ellipse cx="77" cy="57" rx="10" ry="12" fill="#fff"/><circle cx="45" cy="59" r="5" fill="#1b2a3a"/><circle cx="79" cy="59" r="5" fill="#1b2a3a"/></g><circle cx="29" cy="77" r="6" fill="#ff9aa2" opacity=".6"/><circle cx="91" cy="77" r="6" fill="#ff9aa2" opacity=".6"/><ellipse cx="60" cy="85" rx="11" ry="3" fill="#1b2a3a"/></svg>';

/* ---------- state ---------- */
var app=document.getElementById('app');
var view='home',run=null,edit=null,ui={addKid:false},lastView='';

/* ---------- home ---------- */
function kidTabs(){
 var tabs=store.kids.map(function(k){return '<button class="tab" role="tab" data-a="usekid" data-id="'+esc(k.id)+'" aria-selected="'+(k.id===store.kid)+'">'+esc(k.name)+'</button>'}).join('');
 var add=ui.addKid?'<div class="row2" style="margin:-6px 0 14px"><input id="nk" class="field" type="text" maxlength="20" placeholder="Name" aria-label="New kid name"><button class="btn quiet sm" data-a="savekid">Add</button><button class="ghost" data-a="cancelkid">Cancel</button></div>':'';
 return '<nav class="tabs" role="tablist" aria-label="Kids">'+tabs+'<button class="tab plus" data-a="addkid" aria-label="Add a kid">+</button></nav>'+add}
function viewRow(){
 var k=curKid();if(k.chapters.length<2)return '';var cl=curChapter(k),v=k.view||{mode:'current'};
 var val=v.mode==='all'?'all':(v.mode==='chapter'&&v.cid!==cl.id&&k.chapters.some(function(c){return c.id===v.cid})?'C:'+v.cid:'current');
 var past=k.chapters.filter(function(c){return c!==cl}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
 function opt(v2,t){return '<option value="'+esc(v2)+'"'+(val===v2?' selected':'')+'>'+esc(t)+'</option>'}
 return '<section aria-label="Chapter"><label for="viewsel" class="eyebrow" style="margin:0 0 6px">Practice</label><select id="viewsel" class="field">'+
  opt('current','Current chapter: '+cl.name+' ('+fmtDate(cl.date)+')')+opt('all','All chapters combined')+
  (past.length?'<optgroup label="Past chapters">'+past.map(function(c){return opt('C:'+c.id,fmtDate(c.date)+' \u00b7 '+c.name)}).join('')+'</optgroup>':'')+'</select></section>'}
function backupFoot(){return '<div class="foot"><button class="link" data-a="backup">Back up to a file</button><button class="link" data-a="restore">Restore from a file</button><input id="restorefile" type="file" accept="application/json,.json" hidden>'+(ui.note?'<span role="status">'+esc(ui.note)+'</span>':'')+'</div>'}
function homeHTML(){
 var k=curKid(),sc=scope(),top=kidTabs();
 if(!sc.lessons.length)return top+'<header class="top"><div><div class="eyebrow">'+esc(k.name)+'</div><h1>No chapter yet</h1><p class="sub">Add the chapter '+esc(k.name)+' is working on to start practicing.</p></div>'+AVATAR+'</header>'+
  '<div class="btns" style="margin-top:22px"><button class="btn" data-a="newch">Add a chapter for '+esc(k.name)+'</button></div>'+backupFoot();
 var built=sc.lessons.filter(function(l){return LES[l].built});
 var cards=sc.lessons.map(function(id){var l=LES[id];
  if(!l.built)return '<div class="act off"><b>'+esc(id)+' '+esc(l.title)+'</b><span>Coming soon</span></div>';
  return '<button class="act" data-a="start" data-l="'+id+'"><b>'+esc(id)+' '+esc(l.title)+'</b><span>'+esc(l.blurb)+' '+solidIn(id)+' of '+FACTS[id].length+' facts solid.</span></button>'}).join('');
 var ctx=sc.chapter?fmtDate(sc.chapter.date):'All chapters';
 return top+'<header class="top"><div><div class="eyebrow">'+esc(k.name)+' \u00b7 '+esc(ctx)+'</div><h1>'+esc(sc.name)+'</h1><p class="sub">A fact is solid after '+SOLID+' right in a row on the first try.</p></div>'+AVATAR+'</header>'+viewRow()+
  '<section aria-label="Practice"><h2>Practice</h2><div class="acts">'+(built.length>1?'<button class="act mix" data-a="mix"><b>Play a mix</b><span>'+ROUNDS+' problems from every lesson here. Missed facts come back more often.</span></button>':'')+cards+'</div></section>'+
  '<div class="foot"><button class="link" data-a="newch">Add a new chapter</button>'+(sc.chapter?'<button class="link" data-a="editch">Edit this chapter</button>':'')+'<span>Progress stays on this device.</span></div>'+
  backupFoot()}

/* ---------- play (lesson 5-4) ---------- */
function bondHTML(c){var show=c.step!==1,b=c.f.b;
 function circ(cx,cy,v,fill){return '<circle cx="'+cx+'" cy="'+cy+'" r="25" fill="'+(fill?'var(--sound)':'var(--surface)')+'" stroke="'+(fill?'var(--sound-edge)':'var(--ink)')+'" stroke-width="3"/><text x="'+cx+'" y="'+(cy+9)+'" text-anchor="middle" font-size="26" font-weight="700" font-family="Andika,system-ui" fill="'+(fill?'var(--sound-ink)':'var(--ink)')+'">'+v+'</text>'}
 return '<svg class="bond" viewBox="0 0 240 150" role="img" aria-label="Number bond: '+b+' breaks apart into '+(show?c.x+' and '+c.y:'two parts')+'"><path d="M110 52L68 90M130 52L172 90" stroke="var(--ink)" stroke-width="3" fill="none"/>'+circ(120,30,b,true)+circ(60,114,show?c.x:'?',show)+circ(180,114,show?c.y:'?',show)+'<text x="120" y="124" text-anchor="middle" font-size="28" font-weight="700" font-family="Andika,system-ui" fill="var(--ink)">+</text></svg>'}
function eqHTML(c){var f=c.f,d=c.step==='done',s=c.step;
 var h='<div class="eqs" aria-live="polite"><div class="eq">'+f.a+' '+MINUS+' '+f.b+' = '+(d?'<b>'+c.ans+'</b>':'<span class="q">?</span>')+'</div>';
 if(s===3||d)h+='<div class="eq step">'+f.a+' '+MINUS+' '+c.x+' = 10</div>';
 if(s===3||d)h+='<div class="eq step">10 '+MINUS+' '+c.y+' = '+(d?c.ans:'<span class="q">?</span>')+'</div>';
 return h+'</div>'}
function frameHTML(cap,count,crossed,tapAct,tap){var cells='';
 for(var i=0;i<10;i++){
  if(i>=count){cells+='<div class="cell"></div>';continue}
  var x=crossed.indexOf(i)>-1,cls='ctr'+(x?' x':'')+(tap&&!x?' tap':'');
  cells+='<div class="cell">'+(tap?'<button class="'+cls+'" data-a="'+tapAct+'" data-i="'+i+'" aria-label="Counter '+(i+1)+(x?', crossed out':'')+'">'+(x?'\u2715':'')+'</button>':'<span class="'+cls+'">'+(x?'\u2715':'')+'</span>')+'</div>'}
 return '<div class="fw"><div class="fcap">'+cap+'</div><div class="frame">'+cells+'</div></div>'}
function playHTML(){
 var c=run.cur,f=c.f,s=c.step,done=s==='done';
 var pct=Math.round((run.n-1+(done?1:0))/run.total*100);
 var h='<div class="bar"><button class="ghost" data-a="home">\u2039 Back</button><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div><span class="cnt">'+run.n+' / '+run.total+'</span></div>';
 h+=eqHTML(c)+bondHTML(c);
 var p=s===1?'Break apart '+f.b+' into two parts. Which part do you take away first to make a 10?':
  s===2?'Make a 10. Cross out the '+c.x+' extra counter'+(c.x>1?'s':'')+'.':
  s===3?'Now '+MINUS+' '+c.y+'. Cross out '+c.y+' counter'+(c.y>1?'s':'')+' from the full frame, then pick how many are left.':'';
 if(p)h+='<div class="prompt">'+p+'</div>';
 if(s===1)h+='<div class="row" aria-label="Choose a part">'+c.opts.map(function(o){return '<button class="tile" data-a="opt" data-v="'+o+'"'+(c.off.indexOf(o)>-1?' disabled':'')+'>'+o+'</button>'}).join('')+'</div>';
 if(s===3&&c.crossA.length===c.y)h+='<div class="prompt" style="font-size:1.1rem">How many are left?</div><div class="row" aria-label="Choose the answer">'+[1,2,3,4,5,6,7,8,9].map(function(o){return '<button class="tile" data-a="ans" data-v="'+o+'"'+(c.off.indexOf(o)>-1?' disabled':'')+'>'+o+'</button>'}).join('')+'</div>';
 if(c.msg)h+='<div class="msg '+(c.msgType||'info')+'" role="status">'+c.msg+'</div>';
 if(!done){var fa_=frameHTML('Ten frame',10,c.crossA,'ca',s===3),fb_=frameHTML('Extra counters',c.x,c.crossB,'cb',s===2);h+='<div class="frames">'+(s===2?fb_+fa_:fa_+fb_)+'</div>'};
 if(done){
  h+='<div class="worked"><b>Subtract '+f.a+' '+MINUS+' '+f.b+' by making a 10.</b><ol><li>Break apart '+f.b+' into '+c.x+' and '+c.y+'.</li><li>Make a 10: '+f.a+' '+MINUS+' '+c.x+' = 10.</li><li>Subtract the rest: 10 '+MINUS+' '+c.y+' = '+c.ans+'.</li></ol>So '+f.a+' '+MINUS+' '+f.b+' = <b>'+c.ans+'</b>.</div>'+
   '<button class="btn" data-a="next">'+(run.n>=run.total?'See results':'Next problem')+'</button>'}
 return h}
function doneHTML(){
 var s=run.stars,t=run.total,stars='';for(var i=0;i<t;i++)stars+='<i class="star'+(i<s?' on':'')+'"></i>';
 var msg=s>=t-1?'Super subtracting.':s>=Math.ceil(t*0.6)?'Strong round.':'Good practice. The tricky ones will keep coming back until they stick.';
 var miss=run.missed.length?'<section><h2>Practice these again</h2><p class="sub">'+run.missed.map(esc).join(', ')+'</p></section>':'';
 return '<header><div class="eyebrow">Round finished</div><h1>'+s+' of '+t+' on the first try</h1><p class="sub">'+msg+'</p></header><div class="stars" aria-hidden="true">'+stars+'</div>'+miss+
  '<div class="btns" style="margin-top:26px"><button class="btn" data-a="again">Play again</button><button class="btn quiet" data-a="home">Home</button></div>'}

/* ---------- edit chapter ---------- */
function editHTML(){var k=curKid();
 var boxes=CATALOG.map(function(l){var on=edit.lessons.indexOf(l.id)>-1;
  return '<button class="chk" data-a="tgl" data-l="'+l.id+'" aria-pressed="'+on+'"><span class="box">'+(on?'\u2713':'')+'</span><span><b>'+l.id+' '+esc(l.title)+'</b><small>'+(l.built?'Ready to practice':'Saved now, practice coming soon')+'</small></span></button>'}).join('');
 return '<header><div class="eyebrow">'+esc(k.name)+'</div><h1>'+(edit.isNew?'New chapter':'Edit chapter')+'</h1></header>'+
  '<label for="cn">Chapter name</label><input id="cn" class="field" type="text" maxlength="40" value="'+esc(edit.name)+'" placeholder="Chapter 6">'+
  '<label for="cd">Date started</label><input id="cd" class="field" type="date" value="'+esc(edit.date)+'">'+
  '<label>Lessons in this chapter</label><div>'+boxes+'</div><p class="hint">Use the lesson numbers from the book page. Older chapters stay saved for combined review.</p>'+
  (edit.err?'<div class="msg bad" role="alert">'+edit.err+'</div>':'')+
  '<div class="btns" style="margin-top:18px"><button class="btn" data-a="savech">Save chapter</button><button class="btn quiet" data-a="home">Cancel</button></div>'+
  '<div class="foot"><button class="link" data-a="resetProg">'+(edit.confirm?'Tap again to clear '+esc(k.name)+'\'s progress':'Clear '+esc(k.name)+'\'s progress')+'</button></div>'}
function captureEdit(){var n=document.getElementById('cn'),d=document.getElementById('cd');if(n)edit.name=n.value;if(d&&d.value)edit.date=d.value}

function render(){var y=window.scrollY,same=lastView===view;
 app.innerHTML=view==='home'?homeHTML():view==='play'?playHTML():view==='done'?doneHTML():editHTML();
 if(view==='home'&&ui.addKid){var nk=document.getElementById('nk');if(nk)nk.focus()}
 window.scrollTo(0,same?y:0);lastView=view}

/* ---------- game logic ---------- */
function pickFact(lessons,prev){
 var pool=[];lessons.forEach(function(l){(FACTS[l]||[]).forEach(function(f){pool.push(f)})});
 var p2=pool.filter(function(f){return fkey(f)!==prev});if(p2.length)pool=p2;
 var wts=pool.map(function(f){var s=st(f);return s.streak>=SOLID?1:(SOLID+1-s.streak)+(s.miss>0?1:0)});
 var tot=wts.reduce(function(a,b){return a+b},0),r=Math.random()*tot;
 for(var i=0;i<pool.length;i++){r-=wts[i];if(r<=0)return pool[i]}return pool[pool.length-1]}
function makeProblem(f){var x=f.a-10,y=f.b-x,pool=shuffle([1,2,3,4,5,6,7,8,9].filter(function(n){return n!==x})).slice(0,2);
 return{f:f,x:x,y:y,ans:f.a-f.b,opts:[x].concat(pool).sort(function(a,b){return a-b}),off:[],step:1,stepMiss:0,misses:0,crossA:[],crossB:[],msg:'',msgType:'info'}}
function startRun(lessons){run={lessons:lessons,n:0,total:ROUNDS,stars:0,missed:[],prev:null,cur:null};next()}
function next(){if(run.n>=run.total){view='done';render();return}
 run.n++;var f=pickFact(run.lessons,run.prev);run.prev=fkey(f);run.cur=makeProblem(f);view='play';render()}
function recordMiss(c){if(c.misses===0){var s=st(c.f);s.miss++;s.streak=0;if(run.missed.indexOf(flabel(c.f))<0)run.missed.push(flabel(c.f));save()}c.misses++}
function finish(c){c.step='done';c.off=[];
 if(c.misses===0){var s=st(c.f);s.ok++;s.streak++;run.stars++;save();c.msg='<b>'+c.ans+'</b> is right. You made a 10 first.';c.msgType='good'}
 else{c.msgType='info';c.msg=c.msg||'Look at how it works. This one will come back so you get another try.'}}

var H={
 usekid:function(b){if(b.dataset.id===store.kid)return;store.kid=b.dataset.id;ui.addKid=false;save();render()},
 addkid:function(){ui.addKid=true;render()},
 cancelkid:function(){ui.addKid=false;render()},
 savekid:function(){var el=document.getElementById('nk'),n=(el&&el.value||'').trim();if(!n)return;
  if(store.kids.some(function(k){return k.name.toLowerCase()===n.toLowerCase()})){el.value='';el.placeholder='That name is already a tab';return}
  var k=mkKid(n.slice(0,20));store.kids.push(k);store.kid=k.id;ui.addKid=false;save();render()},
 home:function(){run=null;edit=null;view='home';render()},
 start:function(b){startRun([b.dataset.l])},
 mix:function(){startRun(scope().lessons.filter(function(l){return LES[l].built}))},
 again:function(){startRun(run.lessons)},
 next:function(){next()},
 opt:function(b){var c=run.cur;if(c.step!==1)return;var v=+b.dataset.v;
  if(v===c.x){c.step=2;c.stepMiss=0;c.msg='';return render()}
  c.off.push(v);c.stepMiss++;recordMiss(c);
  if(c.stepMiss>=2){c.step=2;c.stepMiss=0;c.off=[];c.msgType='info';c.msg='The part to take away first is <b>'+c.x+'</b>, because '+c.f.a+' '+MINUS+' '+c.x+' = 10. The rest is '+c.y+'.'}
  else{c.msgType='bad';c.msg='Not quite. Look at the extra counters past the first ten. Taking away that many leaves exactly 10.'}
  render()},
 cb:function(b){var c=run.cur;if(c.step!==2)return;var i=+b.dataset.i,at=c.crossB.indexOf(i);
  if(at>-1)c.crossB.splice(at,1);else c.crossB.push(i);
  if(c.crossB.length===c.x){c.step=3;c.crossA=[];c.off=[];c.stepMiss=0;c.msgType='good';c.msg='That makes a 10! '+c.f.a+' '+MINUS+' '+c.x+' = 10.'}else c.msg='';
  render()},
 ca:function(b){var c=run.cur;if(c.step!==3)return;var i=+b.dataset.i,at=c.crossA.indexOf(i);
  if(at>-1)c.crossA.splice(at,1);
  else if(c.crossA.length>=c.y){c.msgType='info';c.msg='You only need to cross out '+c.y+'. Tap a crossed counter to bring it back.';return render()}
  else c.crossA.push(i);
  c.msg='';render()},
 ans:function(b){var c=run.cur;if(c.step!==3||c.crossA.length!==c.y)return;var v=+b.dataset.v;
  if(v===c.ans){return finish(c),render()}
  c.off.push(v);c.stepMiss++;recordMiss(c);
  if(c.stepMiss>=2){c.msg='10 '+MINUS+' '+c.y+' = <b>'+c.ans+'</b>. Count the counters that are not crossed out.';finish(c)}
  else{c.msgType='bad';c.msg='Not quite. Count the counters that are not crossed out in the ten frame.'}
  render()},
 newch:function(){var k=curKid();view='edit';edit={isNew:true,name:'',date:today(),lessons:[],err:'',confirm:false};
  var cur=curChapter(k);if(cur)edit.lessons=[];render()},
 editch:function(){var c=scope().chapter;if(!c)return;view='edit';edit={isNew:false,cid:c.id,name:c.name,date:c.date,lessons:c.lessons.slice(),err:'',confirm:false};render()},
 tgl:function(b){captureEdit();var i=edit.lessons.indexOf(b.dataset.l);if(i>-1)edit.lessons.splice(i,1);else edit.lessons.push(b.dataset.l);render()},
 savech:function(){captureEdit();if(!edit.lessons.length){edit.err='Pick at least one lesson.';return render()}
  var k=curKid(),date=/^\d{4}-\d{2}-\d{2}$/.test(edit.date)?edit.date:today(),name=(edit.name||'').trim()||('Chapter of '+fmtDate(date));
  if(edit.isNew){var c=mkChapter(name,sortL(edit.lessons),date);k.chapters.push(c);k.view=(curChapter(k)===c)?{mode:'current'}:{mode:'chapter',cid:c.id}}
  else{var ch=k.chapters.find(function(x){return x.id===edit.cid});if(ch){ch.name=name;ch.date=date;ch.lessons=sortL(edit.lessons)}}
  save();edit=null;view='home';render()},
 backup:function(){try{var blob=new Blob([JSON.stringify({v:1,kids:store.kids,kid:store.kid},null,1)],{type:'application/json'}),a=document.createElement('a');
   a.href=URL.createObjectURL(blob);a.download='math-workshop-backup-'+today()+'.json';document.body.appendChild(a);a.click();
   setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);ui.note='Backup saved.'}catch(e){ui.note='Could not save a backup here.'}render()},
 restore:function(){var f=document.getElementById('restorefile');if(f){f.value='';f.click()}},
 resetProg:function(){captureEdit();if(!edit.confirm){edit.confirm=true;return render()}
  curKid().stats={};save();edit=null;view='home';render()}
};
app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;var f=H[b.dataset.a];if(f)f(b)});
app.addEventListener('change',function(e){
 if(e.target.id==='restorefile'){var fl=e.target.files&&e.target.files[0];if(!fl)return;var rd=new FileReader();
  rd.onload=function(){try{var raw=JSON.parse(rd.result);if(!raw||!Array.isArray(raw.kids)||!raw.kids.length)throw 0;
   raw.kids.forEach(fixKid);store.kids=raw.kids;store.kid=raw.kid;
   if(!store.kids.some(function(k){return k.id===store.kid}))store.kid=store.kids[0].id;
   save();ui.note='Restored '+store.kids.length+' profile'+(store.kids.length>1?'s':'')+'.'}catch(x){ui.note='That file is not a math backup.'}render()};
  rd.onerror=function(){ui.note='Could not read that file.';render()};rd.readAsText(fl);return}
 if(e.target.id!=='viewsel')return;var v=e.target.value,k=curKid();
 k.view=v==='all'?{mode:'all'}:v.slice(0,2)==='C:'?{mode:'chapter',cid:v.slice(2)}:{mode:'current'};save();render()});

/* test hook, harmless in normal use */
window.__math={FACTS:FACTS,makeProblem:makeProblem};
render();
})();
</script>
